<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Report Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #faf6ec; --panel: #efe8d7; --card: #fffdf7; --ink: #171310; --muted: #7b7161; --line: #e2d9c6;
  --accent: #d8431a; --accent-soft: #f6d9cc; --good: #3d7a2a; --bad: #b3261e;
  --sans: 'Inter', -apple-system, system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --display: 'Bricolage Grotesque', 'Inter', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #14120f; --panel: #23201a; --card: #1b1814; --ink: #f7f2e7; --muted: #9d9385; --line: #332e26;
    --accent: #ff7f57; --accent-soft: #4a2519; --good: #8fcf73; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #14120f; --panel: #23201a; --card: #1b1814; --ink: #f7f2e7; --muted: #9d9385; --line: #332e26;
  --accent: #ff7f57; --accent-soft: #4a2519; --good: #8fcf73; --bad: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); }
header { display: flex; align-items: center; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--ground); z-index: 5; flex-wrap: wrap; }
.brand { font: 700 19px/1 var(--display); letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
nav { display: flex; gap: 4px; }
nav a { padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 500; }
nav a.on { background: var(--ink); color: var(--ground); }
.env { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
main { padding: 20px 24px 60px; max-width: 1480px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.seg { display: inline-flex; background: var(--panel); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font: 500 13px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 13px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 6px; align-items: center; background: var(--accent-soft); border-radius: 999px; padding: 3px 6px 3px 10px; font: 12px var(--mono); max-width: 420px; }
.chip b { font-weight: 500; color: var(--muted); }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: none; color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
.status { color: var(--muted); font-size: 12px; margin-left: auto; }
.status.err { color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.kpi .v { font: 700 30px/1.1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.card h2 { font: 650 15px/1.2 var(--display); margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
.card h2 small { font: 400 12px var(--sans); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.full { margin-top: 12px; }
#chart { position: relative; height: 180px; }
#chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
#chart .axis { fill: var(--muted); font: 11px var(--sans); }
#chart .grid-line { stroke: var(--line); }
#chart rect.bar { fill: var(--accent); }
#chart rect.hit { fill: transparent; cursor: default; }
#chart rect.hit:hover + rect.bar, #chart g:hover rect.bar { opacity: .75; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--ground); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; display: none; z-index: 3; }
.scroll { overflow: auto; max-height: 420px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.dim { color: var(--muted); }
.clip { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.f { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: pointer; }
a.f:hover { color: var(--accent); border-color: var(--accent); }
.meter { position: relative; }
.meter i { position: absolute; left: 0; top: 3px; bottom: 3px; background: var(--accent-soft); border-radius: 0 4px 4px 0; z-index: 0; }
.meter span { position: relative; z-index: 1; }
.s2 { color: var(--good); } .s3 { color: var(--muted); } .s4, .s5 { color: var(--bad); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.loading main { opacity: .55; transition: opacity .2s; }
@media (max-width: 860px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .status { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="brand">harness<span>/</span>admin</div>
  <nav><a class="on" href="#visits">Visits</a></nav>
  <div class="env" id="env"></div>
</header>
<main>
  <div class="controls">
    <div class="seg" id="range">
      <button data-v="1">1h</button><button data-v="24">24h</button><button data-v="168">7d</button><button data-v="720">30d</button><button data-v="2160">90d</button>
    </div>
    <div class="seg" id="view">
      <button data-v="pages" title="Page loads: no assets, no API calls">Pages</button><button data-v="api" title="/api, /auth, /raw, /mcp">API</button><button data-v="all">Everything</button>
    </div>
    <label class="chk"><input type="checkbox" id="bots"> Include bots</label>
    <button class="btn" id="refresh">Refresh</button>
    <div class="chips" id="chips"></div>
    <div class="status" id="status"></div>
  </div>

  <section class="kpis">
    <div class="kpi"><div class="v" id="k-visitors">–</div><div class="l">Unique IPs</div></div>
    <div class="kpi"><div class="v" id="k-requests">–</div><div class="l">Requests</div></div>
    <div class="kpi"><div class="v" id="k-countries">–</div><div class="l">Countries</div></div>
    <div class="kpi"><div class="v" id="k-paths">–</div><div class="l">Distinct paths</div></div>
  </section>

  <section class="card"><h2>Unique visitors over time <small id="bucket"></small></h2><div id="chart"></div></section>

  <section class="card full"><h2>Visitors <small>top 100 by requests · click an IP to see only its requests</small></h2>
    <div class="scroll"><table id="t-ips"></table></div></section>

  <div class="grid">
    <section class="card"><h2>Paths</h2><div class="scroll"><table id="t-paths"></table></div></section>
    <section class="card"><h2>Referrers <small>outside the site</small></h2><div class="scroll"><table id="t-referers"></table></div></section>
    <section class="card"><h2>Countries</h2><div class="scroll"><table id="t-countries"></table></div></section>
    <section class="card"><h2>Status codes</h2><div class="scroll"><table id="t-statuses"></table></div></section>
  </div>

  <section class="card full"><h2>Requests <small>newest first · up to 1,000</small></h2>
    <div class="scroll" style="max-height:640px"><table id="t-log"></table></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const FILTERS = ['ip', 'path', 'country', 'asn', 'referer', 'agent'];
const DEFAULTS = { hours: '24', view: 'pages', bots: '0' };
let state = load();
let rdns = {};
let seq = 0;

function load() {
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  const s = { ...DEFAULTS };
  for (const [k, v] of q) s[k] = v;
  return s;
}
function save() {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v && v !== DEFAULTS[k]) q.set(k, v);
  history.replaceState(null, '', '#visits' + (q.toString() ? '?' + q : ''));
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => n == null || n === '' ? '–' : Number(n).toLocaleString();
const dec = s => { try { return decodeURIComponent(s); } catch { return s; } };
function when(t) {
  if (!t) return '';
  const d = new Date(t.replace(' ', 'T') + (t.endsWith('Z') ? '' : 'Z'));
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function ago(t) {
  const d = new Date(t.replace(' ', 'T') + (t.endsWith('Z') ? '' : 'Z'));
  const s = (Date.now() - d) / 1000;
  return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + 'm ago' : s < 129600 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago';
}
function agentShort(ua) {
  if (!ua || ua === '-') return '–';
  ua = dec(ua);
  const os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'macOS' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '';
  const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : null;
  if (!br) return ua.length > 40 ? ua.slice(0, 40) + '…' : ua;
  return [br, os].filter(Boolean).join(' · ');
}
const f = (k, v, label) => v && v !== '-' ? `<a class="f" data-k="${k}" data-v="${esc(v)}" title="${esc(dec(v))}">${esc(label ?? dec(v))}</a>` : '<span class="dim">–</span>';

function table(el, cols, rows, empty = 'Nothing in this window.') {
  if (!rows.length) { el.innerHTML = `<tr><td class="empty">${empty}</td></tr>`; return; }
  const max = Math.max(...rows.map(r => +r[cols.find(c => c.meter)?.key] || 0), 1);
  el.innerHTML = '<thead><tr>' + cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.h}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + cols.map(c => {
      const v = c.fmt ? c.fmt(r) : esc(r[c.key]);
      if (c.meter) return `<td class="n meter"><i style="width:${(100 * (+r[c.key] || 0) / max).toFixed(1)}%"></i><span>${num(r[c.key])}</span></td>`;
      return `<td class="${[c.n && 'n', c.cls].filter(Boolean).join(' ')}">${c.n ? num(r[c.key]) : v}</td>`;
    }).join('') + '</tr>').join('') + '</tbody>';
}

function chart(rows, bucket) {
  const el = $('#chart');
  $('#bucket').textContent = `per ${bucket === '5m' ? '5 minutes' : bucket === '1h' ? 'hour' : 'day'} · hover for requests`;
  if (!rows.length) { el.innerHTML = '<div class="empty">No traffic in this window.</div>'; return; }
  const W = el.clientWidth, H = el.clientHeight, L = 36, B = 22, T = 8;
  const max = Math.max(...rows.map(r => +r.visitors), 1);
  const nice = Math.pow(10, Math.floor(Math.log10(max))), top = Math.max(2, Math.ceil(max / nice) * nice + (Math.ceil(max / nice) * nice) % 2);
  const n = rows.length, slot = (W - L) / n, bw = Math.max(1, Math.min(28, slot - 2));
  const y = v => T + (H - T - B) * (1 - v / top);
  const ticks = [0, top / 2, top].filter((v, i, a) => a.indexOf(v) === i);
  const every = Math.ceil(n / Math.max(1, Math.floor((W - L) / 90)));
  const lab = t => { const d = new Date(t.replace(' ', 'T') + 'Z'); return bucket === '1d' ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : d.toLocaleTimeString(undefined, { hour: 'numeric', minute: bucket === '5m' ? '2-digit' : undefined }); };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unique visitors per ${bucket}">`;
  for (const t of ticks) s += `<line class="grid-line" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${num(t)}</text>`;
  rows.forEach((r, i) => {
    const x = L + i * slot + (slot - bw) / 2, h = Math.max(0, H - B - y(+r.visitors)), rr = Math.min(4, bw / 2, h);
    const path = h > 0 ? `M${x},${H - B} V${H - B - h + rr} Q${x},${H - B - h} ${x + rr},${H - B - h} H${x + bw - rr} Q${x + bw},${H - B - h} ${x + bw},${H - B - h + rr} V${H - B} Z` : '';
    s += `<g data-i="${i}"><rect class="hit" x="${L + i * slot}" y="${T}" width="${slot}" height="${H - T - B}"/>${path ? `<path d="${path}" style="fill:var(--accent)"/>` : ''}</g>`;
    if (i % every === 0) s += `<text class="axis" x="${L + i * slot + slot / 2}" y="${H - 5}" text-anchor="middle">${lab(r.t)}</text>`;
  });
  el.innerHTML = s + '</svg><div class="tip" id="tip"></div>';
  const tip = $('#tip');
  el.querySelectorAll('g[data-i]').forEach(g => {
    g.addEventListener('mouseenter', () => {
      const r = rows[+g.dataset.i];
      tip.innerHTML = `<b>${when(r.t)}</b><br>${num(r.visitors)} visitors · ${num(r.requests)} requests`;
      tip.style.left = (L + (+g.dataset.i + .5) * slot) + 'px'; tip.style.top = y(+r.visitors) + 'px'; tip.style.display = 'block';
      g.querySelector('path')?.style.setProperty('opacity', '.75');
    });
    g.addEventListener('mouseleave', () => { tip.style.display = 'none'; g.querySelector('path')?.style.removeProperty('opacity'); });
  });
}

const host = ip => rdns[ip] ? `<div class="dim clip" title="${esc(rdns[ip])}">${esc(rdns[ip])}</div>` : '';
function renderIps(rows) {
  table($('#t-ips'), [
    { h: 'IP', fmt: r => f('ip', r.ip, r.ip) + host(r.ip), cls: 'mono' },
    { h: 'Country', fmt: r => f('country', r.ip_country) },
    { h: 'Network', fmt: r => f('asn', r.ip_asn, r.ip_asn ? 'AS' + r.ip_asn : ''), cls: 'mono' },
    { h: 'Requests', key: 'requests', meter: true },
    { h: 'Paths', key: 'paths', n: true },
    { h: 'First seen', fmt: r => `<span title="${esc(r.first)}">${when(r.first)}</span>`, cls: 'dim' },
    { h: 'Last seen', fmt: r => `<span title="${when(r.last)}">${ago(r.last)}</span>` },
    { h: 'Browser', fmt: r => f('agent', r.ip_agent, agentShort(r.ip_agent)) },
  ], rows);
}

async function get(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function refresh() {
  const mine = ++seq;
  save(); sync();
  const q = new URLSearchParams(Object.entries(state).filter(([, v]) => v)).toString();
  $('#status').className = 'status'; $('#status').textContent = 'Querying CloudWatch Logs…';
  document.body.classList.add('loading');
  const t0 = performance.now();
  try {
    const [s, log] = await Promise.all([get('/api/visits/summary?' + q), get('/api/visits/requests?' + q)]);
    if (mine !== seq) return;
    const t = s.totals;
    $('#k-visitors').textContent = num(t.visitors ?? 0); $('#k-requests').textContent = num(t.requests ?? 0);
    $('#k-countries').textContent = num(t.countries ?? 0); $('#k-paths').textContent = num(t.paths ?? 0);
    last = [s.timeline, s.window.bucket]; chart(...last);
    renderIps(s.ips);
    table($('#t-paths'), [{ h: 'Path', fmt: r => f('path', r.path), cls: 'mono clip' }, { h: 'Visitors', key: 'visitors', n: true }, { h: 'Requests', key: 'requests', meter: true }], s.paths);
    table($('#t-referers'), [{ h: 'Referrer', fmt: r => f('referer', r.referer), cls: 'clip' }, { h: 'Visitors', key: 'visitors', n: true }, { h: 'Requests', key: 'requests', meter: true }], s.referers, 'No outside referrers in this window.');
    table($('#t-countries'), [{ h: 'Country', fmt: r => f('country', r.country) }, { h: 'Visitors', key: 'visitors', meter: true }, { h: 'Requests', key: 'requests', n: true }], s.countries);
    table($('#t-statuses'), [{ h: 'Status', fmt: r => `<span class="s${String(r.status)[0]}">${esc(r.status)}</span>`, cls: 'mono' }, { h: 'Requests', key: 'requests', meter: true }], s.statuses);
    table($('#t-log'), [
      { h: 'Time', fmt: r => when(r.time), cls: 'dim' },
      { h: 'IP', fmt: r => f('ip', r.ip, r.ip), cls: 'mono' },
      { h: 'Ctry', fmt: r => f('country', r.country) },
      { h: 'Method', key: 'method', cls: 'mono' },
      { h: 'Path', fmt: r => f('path', r.path) + (r.query && r.query !== '-' ? `<span class="dim">?${esc(dec(r.query))}</span>` : ''), cls: 'mono clip' },
      { h: 'Status', fmt: r => `<span class="s${String(r.status)[0]}">${esc(r.status)}</span>`, cls: 'mono' },
      { h: 'Referrer', fmt: r => f('referer', r.referer), cls: 'clip' },
      { h: 'User agent', fmt: r => f('agent', r.agent, agentShort(r.agent)) },
      { h: 'Edge', fmt: r => `<span title="${esc(r.result)}">${esc(r.edge)}</span>`, cls: 'dim mono' },
      { h: 'Secs', key: 'seconds', cls: 'dim mono' },
    ], log.rows);
    $('#status').textContent = `${num(log.rows.length)} requests loaded in ${((performance.now() - t0) / 1000).toFixed(1)}s · ${new Date().toLocaleTimeString()}`;
    const ips = s.ips.map(r => r.ip).filter(ip => !(ip in rdns));
    if (ips.length) get('/api/rdns?ips=' + ips.join(',')).then(m => { if (mine !== seq) return; Object.assign(rdns, m); renderIps(s.ips); }).catch(() => {});
  } catch (e) {
    if (mine !== seq) return;
    $('#status').className = 'status err'; $('#status').textContent = e.message;
  } finally {
    if (mine === seq) document.body.classList.remove('loading');
  }
}

function sync() {
  for (const [id, key] of [['#range', 'hours'], ['#view', 'view']])
    $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === state[key]));
  $('#bots').checked = state.bots === '1';
  $('#chips').innerHTML = FILTERS.filter(k => state[k]).map(k =>
    `<span class="chip"><b>${k}</b><span title="${esc(dec(state[k]))}">${esc(k === 'agent' ? agentShort(state[k]) : dec(state[k]))}</span><button data-k="${k}" aria-label="Remove ${k} filter">×</button></span>`).join('');
}

$('#range').addEventListener('click', e => { if (e.target.dataset.v) { state.hours = e.target.dataset.v; refresh(); } });
$('#view').addEventListener('click', e => { if (e.target.dataset.v) { state.view = e.target.dataset.v; refresh(); } });
$('#bots').addEventListener('change', e => { state.bots = e.target.checked ? '1' : '0'; refresh(); });
$('#refresh').addEventListener('click', refresh);
$('#chips').addEventListener('click', e => { if (e.target.dataset.k) { delete state[e.target.dataset.k]; refresh(); } });
document.addEventListener('click', e => {
  const a = e.target.closest('a.f'); if (!a) return;
  e.preventDefault(); state[a.dataset.k] = a.dataset.v; window.scrollTo({ top: 0, behavior: 'smooth' }); refresh();
});
let last = null;
window.addEventListener('resize', () => { clearTimeout(window._r); window._r = setTimeout(() => last && chart(...last), 150); });
get('/api/whoami').then(w => $('#env').textContent = `${w.profile} · ${w.log_group} · ${w.region}`).catch(() => {});
refresh();
</script>
</body>
</html>
