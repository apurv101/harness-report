/* Ink on warm paper, one electric accent, two state colours.  Light and dark. */
:root {
  --brand: #d8431a;
  --brand-hover: #b23414;
  --brand-soft: #fdeee7;
  --brand-border: #f0c4b2;
  --focus: #d8431a;
  --background: #faf6ec;
  --surface-subtle: #f4eee0;
  --surface-muted: #efe8d7;
  --card: #fffdf8;
  --product-ink: #171310;
  --text-secondary: #3a3129;
  --product-muted: #7b7161;
  --product-line: #e2d9c6;
  --line-soft: #ece5d5;
  --line-strong: #c7b99f;
  --zing: #c8ec1f;            /* pass */
  --zing-ink: #38460a;
  --flare: #e03e14;           /* needs work */
  --flare-soft: #ffe8e1;
  --hard: #171310;            /* the offset-shadow colour */
  --logo-ink: #171310;
  --logo-accent: #d8431a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #ff7f57;
    --brand-hover: #ff9b7b;
    --brand-soft: #2e1c14;
    --brand-border: #56342a;
    --focus: #ff7f57;
    --background: #14120f;
    --surface-subtle: #1d1a15;
    --surface-muted: #23201a;
    --card: #1a1713;
    --product-ink: #f7f2e7;
    --text-secondary: #d6cdbc;
    --product-muted: #9d9385;
    --product-line: #332e26;
    --line-soft: #2b261f;
    --line-strong: #4c4339;
    --zing: #b9dd15;
    --zing-ink: #131c00;
    --flare: #ff7b5c;
    --flare-soft: #3a201a;
    --hard: #4a4034;
    --logo-ink: #f7f2e7;
    --logo-accent: #ff7f57;
  }
}
html { scroll-behavior: smooth; }
body.product-page { color-scheme: light dark; --ground: var(--background); --panel: var(--surface-muted); --ink: var(--product-ink); --muted: var(--product-muted); --line: var(--product-line); --accent: var(--brand); background: var(--ground); color: var(--ink); }

/* Minimal site landing. */
:root { color-scheme: light dark; --ground: var(--background); --panel: var(--surface-muted); --ink: var(--product-ink); --muted: var(--product-muted); --line: var(--product-line); --accent: var(--brand); --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif; --mono: 'JetBrains Mono', ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; --display: 'Bricolage Grotesque', 'Inter', -apple-system, "Helvetica Neue", sans-serif; }

/* ------------------------------------------------------------------ *
 *  Character layer.  Everything above is structure; this is the voice:
 *  a display face, offset shadows instead of hairlines, the logo's own
 *  constellation as wallpaper, and colour that actually means pass/fail.
 * ------------------------------------------------------------------ */

.wordmark, .hero h1, .product-page h2, .flow-heading h1, .success-heading h1,
.evaluation-score > strong, .runs-view h1, .signin-card h2, .flow-sidebar h2 {
  font-family: var(--display);
  font-variation-settings: 'wdth' 88;
}
.wordmark { font-weight: 800; letter-spacing: -.5px; font-size: 19px; }
.product-page h2, .flow-heading h1, .success-heading h1, .signin-card h2, .flow-sidebar h2 { font-weight: 700; }

/* Eyebrows and labels go monospace — this is a measurement tool. */
.eyebrow, .local-tag, .visual-caption, .intro-line span { font-family: var(--mono); font-weight: 500; }
.eyebrow { border: 1.5px solid var(--product-ink); border-radius: 999px; padding: 5px 11px 5px 9px; display: inline-flex; background: var(--card); box-shadow: 2px 2px 0 var(--hard); }
.status-dot { width: 7px; height: 7px; background: var(--zing); box-shadow: 0 0 0 0 var(--zing); animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--zing) 70%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }

/* Buttons: a hard offset that collapses under the press. */
.ui-btn { border: 1.5px solid var(--product-ink); border-radius: 9px; background: var(--card); box-shadow: 3px 3px 0 var(--hard); font-weight: 550; transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .15s; }
.ui-btn:hover { background: var(--zing); color: var(--product-ink); transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--hard); }
.ui-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--hard); }
.ui-btn.primary { background: var(--product-ink); border-color: var(--product-ink); color: var(--background); }
.ui-btn.primary:hover { background: var(--brand); border-color: var(--product-ink); color: #fff; }
.ui-btn:disabled { box-shadow: 0 0 0 var(--hard); transform: none; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 4px; }

/* Hero: bigger, tighter, and the payoff word gets a marker stripe. */
.hero h1 { font-weight: 800; letter-spacing: -3.2px; font-variation-settings: 'wdth' 82; }
.hero h1 span { color: var(--zing-ink); background: linear-gradient(178.5deg, transparent 6%, var(--zing) 6%, var(--zing) 95%, transparent 95%); padding: 0 .08em; margin-left: -.08em; }
.hero .hero-copy { font-size: 17px; }

/* The logo's node-and-edge graph, blown up as wallpaper — a harness run *is* a graph. */
.hero-visual::before { background-image: radial-gradient(color-mix(in srgb, var(--line-strong) 75%, transparent) .8px, transparent .8px); }
.hero-graph { position: absolute; z-index: 0; width: 86%; left: -56%; top: -14%; color: var(--brand); opacity: .22; pointer-events: none; transform: rotate(-11deg); }
.hero-graph path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.9s .3s ease forwards; }
.hero-graph circle { opacity: 0; animation: pop .5s ease forwards; transform-box: fill-box; transform-origin: center; }
.hero-graph circle:nth-child(1) { animation-delay: .8s; } .hero-graph circle:nth-child(2) { animation-delay: .95s; }
.hero-graph circle:nth-child(3) { animation-delay: 1.1s; } .hero-graph circle:nth-child(4) { animation-delay: 1.25s; }
.hero-graph circle:nth-child(5) { animation-delay: 1.4s; } .hero-graph circle:nth-child(6) { animation-delay: 1.55s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }

/* A second card stacked behind the report, and the tilt restored. */
.hero-visual::after { content: ''; position: absolute; inset: 34px 14px 28px; border: 1.5px solid var(--product-ink); border-radius: 13px; background: var(--surface-subtle); transform: rotate(2.4deg); z-index: 0; }
.preview-window { position: relative; z-index: 1; transform: rotate(-1.6deg); border: 1.5px solid var(--product-ink); border-radius: 13px; box-shadow: 7px 7px 0 var(--hard); transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
.preview-window:hover { transform: rotate(0deg) translateY(-3px); }
.window-chrome { border-bottom: 1.5px solid var(--product-ink); background: var(--surface-subtle); }
.window-chrome > i { height: 9px; width: 9px; border: 1.2px solid var(--product-ink); }
.window-chrome > i:nth-child(1) { background: var(--flare); }
.window-chrome > i:nth-child(2) { background: var(--zing); }
.window-chrome > i:nth-child(3) { background: var(--product-ink); }
.window-chrome > span { font-family: var(--mono); font-weight: 500; }

/* The score is the product.  Treat it like the product. */
.evaluation-score > strong { font-size: clamp(64px, 8vw, 92px); font-weight: 800; letter-spacing: -4px; line-height: .95; font-variation-settings: 'wdth' 80; }
.evaluation-score > strong span { color: var(--product-muted); font-size: .45em; letter-spacing: -2px; }
.evaluation-score > span { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-top: 10px; }
.evaluation-row { border-top: 1.5px dashed var(--line-strong); font-size: 13px; }

/* Pass and fail should not look alike. */
.pass-label { background: var(--zing); color: var(--zing-ink); border: 1.2px solid var(--product-ink); font-weight: 600; font-size: 11px; padding: 3px 8px; border-radius: 999px; }
.fail-label { background: var(--flare-soft); color: var(--flare); border: 1.2px solid var(--flare); font-weight: 600; border-radius: 999px; }

/* Numbered steps, set big. */
.simple-steps { border-top: 1.5px solid var(--product-ink); font-size: 14px; color: var(--text-secondary); align-items: center; }
.simple-steps b { font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--brand); margin-right: 12px; letter-spacing: -1.5px; vertical-align: -4px; }

/* Cards and panels pick up the same hard edge. */
.flow-card, .runs-view .run-table, .runs-view .empty-card { border: 1.5px solid var(--product-ink); border-radius: 13px; box-shadow: 5px 5px 0 var(--hard); }
.repo-option { border: 1.5px solid var(--line-strong); border-radius: 9px; transition: transform .12s, box-shadow .12s, background .15s; }
.repo-option:hover { background: var(--card); border-color: var(--product-ink); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--hard); }
.product-page input { border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--card); }
.product-page input:focus { border-color: var(--brand); }
.flow-step-circle { border-width: 1.5px; border-color: var(--product-ink); font-family: var(--mono); font-weight: 500; }
.flow-steps .current .flow-step-circle { background: var(--brand); box-shadow: 3px 3px 0 var(--hard); }
.flow-steps .complete .flow-step-circle { background: var(--zing); color: var(--zing-ink); }
.success-symbol { background: var(--zing); color: var(--zing-ink); border: 1.5px solid var(--product-ink); box-shadow: 3px 3px 0 var(--hard); }
.result-facts dd { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -1.4px; color: var(--product-ink); }
.check-progress > div { background: var(--zing); }
.preview-notice { background: var(--zing); color: var(--zing-ink); border-bottom: 1.5px solid var(--product-ink); font-weight: 500; }
.preview-notice strong { color: var(--zing-ink); }
header.top { border-bottom: 1.5px solid var(--product-ink); }
.product-footer { border-top: 1.5px solid var(--product-ink); font-family: var(--mono); }

/* The run viewer earns the same colour language. */
.runs-view { --ok: var(--zing-ink); --bad: var(--flare); --warn: #9a6b12; --user: var(--product-ink); --asst: var(--brand); --tool: #1f7a6b; }
.runs-view h1 { font-weight: 800; letter-spacing: -1.4px; }
.runs-view .pill { border-width: 1.2px; font-weight: 600; border-radius: 999px; }
.runs-view .pill.ok { background: var(--zing); border-color: var(--product-ink); }
.runs-view .pill.bad { background: var(--flare-soft); }
.runs-view .run-table th { font-family: var(--mono); background: var(--surface-subtle); border-bottom: 1.5px solid var(--product-ink); }
.runs-view tr.row:hover { background: var(--brand-soft); }
.runs-view .msg { border-left: 3px solid transparent; padding-left: 10px; }
.runs-view .msg.system { border-left-color: var(--sys); }
.runs-view .msg.user { border-left-color: var(--product-ink); }
.runs-view .msg.assistant { border-left-color: var(--asst); }
.runs-view .msg.tool { border-left-color: var(--tool); }
.runs-view .task { border-left-width: 4px; border-radius: 9px; }
.runs-view nav.tabs button { font-family: var(--mono); font-size: 12.5px; }
.runs-view nav.tabs button.on { border-bottom-width: 3px; }

/* Everything arrives, rather than just being there. */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero > div:first-child > * { animation: rise .65s cubic-bezier(.2,.8,.3,1) backwards; }
.hero > div:first-child > *:nth-child(1) { animation-delay: .04s; }
.hero > div:first-child > *:nth-child(2) { animation-delay: .12s; }
.hero > div:first-child > *:nth-child(3) { animation-delay: .2s; }
.hero > div:first-child > *:nth-child(4) { animation-delay: .28s; }
.hero-visual { animation: rise .8s .18s cubic-bezier(.2,.8,.3,1) backwards; }
.simple-steps > span { animation: rise .6s .36s cubic-bezier(.2,.8,.3,1) backwards; }

@media (max-width: 780px) { .preview-window, .hero-visual::after { transform: none; } .hero-visual::after, .hero-graph { display: none; } .hero h1 { letter-spacing: -2.6px; } }
@media (prefers-reduced-motion: reduce) { .hero-graph path { stroke-dashoffset: 0; } .hero-graph circle { opacity: 1; } .status-dot { animation: none; } }

</style>
</head>

<g stroke="var(--logo-accent, #0b5fd1)" stroke-width="2.7" stroke-linecap="round"><path d="m26 28 10 5 8-8M36 33l-9 9m9-9 9 9m-9-9-3-13"/></g>
<g fill="var(--logo-accent, #0b5fd1)"><circle cx="26" cy="28" r="4"/><circle cx="33" cy="20" r="4"/><circle cx="44" cy="25" r="4"/><circle cx="36" cy="33" r="4.5"/><circle cx="27" cy="42" r="4"/><circle cx="45" cy="42" r="4"/></g></g></svg><span>Harness Report</span></a>

<main><div class="wrap" id="app"></div></main>
<noscript><div class="wrap"><h1>Evaluate your harness.</h1><p>Connect your code. Run real tasks. See how your agent performs.</p><p>Enable JavaScript to explore the preview.</p></div></noscript>
<script>
// Local, UI-only onboarding. No OAuth, repository reads, or evaluations are performed.
window.HarnessUI = (() => {
  'use strict';
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons = {
    github: '<path fill="currentColor" stroke="none" d="M12 .8a11.4 11.4 0 0 0-3.6 22.2c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6a4.7 4.7 0 0 1 1.2-3.2c-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.4 1.2a11.7 11.7 0 0 1 6.2 0C17.8 4.2 18.8 4.5 18.8 4.5c.6 1.7.2 3 .1 3.3a4.7 4.7 0 0 1 1.2 3.2c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.4 11.4 0 0 0 12 .8Z"/>',
    arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
    down: '<path d="M12 5v14m-5-5 5 5 5-5"/>',
    back: '<path d="M19 12H5m5-5-5 5 5 5"/>',
    check: '<path d="m5 12 4 4L19 6"/>',
    repo: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 16h14M9 7h6M9 10h4"/>',
    shield: '<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-5"/>',
    terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/>',
    chart: '<path d="M4 3v17h17M8 15v-4m5 4V6m5 9V9"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
    lock: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>',
    branch: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v10m12-10v1c0 5-12 3-12 8"/>',
    play: '<path d="m9 5 11 7-11 7V5Z"/>',
    layers: '<path d="m12 3 10 5-10 5L2 8l10-5Zm-10 9 10 5 10-5M2 16l10 5 10-5"/>',
    refresh: '<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 2M5 16a8 8 0 0 0 13 2"/>',
  };
  const icon = name => `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.check}</svg>`;
  const output = '1  2  Fizz  4  Buzz  Fizz  7  8  Fizz  Buzz  11  Fizz  13  14  FizzBuzz';
  const storageKey = 'harness-report-site-preview-v1';
  const readSession = () => { try { return JSON.parse(sessionStorage.getItem(storageKey)) || {}; } catch { return {}; } };
  let state = readSession();
  // Stored preview state is never an authentication or verification credential.
  if (typeof state !== 'object' || Array.isArray(state)) state = {};
  if (typeof state.repo !== 'string' || !/^[a-z\d](?:[a-z\d-]{0,38})\/[a-z\d_.-]+$/i.test(state.repo)) delete state.repo;
  let timers = [];
  let active = false;
  let session = null;                                  // /api/me once the server answers; null on the static preview
  const live = () => !!(session && session.auth);      // real GitHub sign-in, not the simulation
  const signedIn = () => live() ? !!session.user : !!state.connected;
  const api = path => fetch(path, { headers: { Accept: 'application/json' } }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));
  const stages = [
    ['Fetch repository', 'Read the harness from your selected repository.'],
    ['Prepare environment', 'Set up an isolated environment for your harness.'],
    ['Run FizzBuzz', 'Ask your agent to create and run a small Python program.'],
    ['Verify output', 'Compare the result with the expected output.'],
  ];
  const repos = [
    { name: 'your-workspace/my-agent', language: 'Python', description: 'Your agent harness', visibility: 'Private' },
    { name: 'your-workspace/research-agent', language: 'TypeScript', description: 'A research assistant', visibility: 'Private' },
    { name: 'SWE-agent/mini-swe-agent', language: 'Python', description: 'Try a public harness', visibility: 'Public' },
  ];
  const save = () => { try { sessionStorage.setItem(storageKey, JSON.stringify(state)); } catch {} };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  function focusHeading() {
    const heading = document.querySelector('main h1');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus({preventScroll: true}); }
  }
  const footer = () => `<footer class="product-footer"><span>© 2026 Harness Report</span><a href="https://www.linkedin.com/company/harnessreport/" rel="me">LinkedIn ↗</a></footer>`;
  const previewNotice = () => live() ? '' : `<div class="preview-notice">Preview · GitHub connection and task results are simulated.</div>`;
  function navigate(path) { window.RunViewer?.cancel(); history.pushState({}, '', path === '/' ? location.pathname : '#' + path.slice(1)); render(); window.scrollTo(0, 0); focusHeading(); }
  function shell(content) { document.getElementById('app').innerHTML = content + footer(); }
  function stepList(step) {
    return `<ol class="flow-steps">${[['Sign in', 'Connect with GitHub'], ['Import harness', 'Choose your repository'], ['Evaluate', 'Run your first task']].map(([title, detail], i) => `<li class="${step > i + 1 ? 'complete' : step === i + 1 ? 'current' : ''}" ${step === i + 1 ? 'aria-current="step"' : ''}><span class="flow-step-circle">${step > i + 1 ? icon('check') : i + 1}</span><div class="flow-step-text"><strong>${title}</strong><span>${detail}</span></div></li>`).join('')}</ol>`;
  }
  function flow(step, content) {
    shell(`${previewNotice()}<div class="flow-layout"><aside class="flow-sidebar"><a class="back-link" href="#">${icon('back')} Home</a><h2>Connect your harness.</h2>${stepList(step)}</aside><section class="flow-content" aria-label="Harness setup">${content}</section></div>`);
  }
  function heading(step, title, text) { return `<div class="flow-heading"><div class="eyebrow">STEP ${step} OF 3</div><h1 tabindex="-1">${title}</h1><p>${text}</p></div>`; }
  function repoSummary(change = true) { return `<div class="selected-repo">${icon('github')}<span>${escape(state.repo)}</span>${change ? '<a href="#import" class="text-link">Change repository</a>' : ''}</div>`; }
  function landing() {
    document.title = 'Harness Report — Evaluate your harness';
    shell(`<section class="hero"><div><div class="eyebrow"><span class="status-dot"></span> FOR AGENT BUILDERS</div><h1>Evaluate your<br><span>harness.</span></h1><p class="hero-copy">Connect your code. Run real tasks.<br>See how your agent performs.</p><div class="hero-buttons"><a class="ui-btn primary" href="#connect">${icon('github')} Continue with GitHub ${icon('arrow')}</a></div></div><div class="hero-visual"><svg class="hero-graph" viewBox="0 0 72 72" aria-hidden="true" focusable="false"><g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="m26 28 10 5 8-8"/><path pathLength="1" d="M36 33l-9 9"/><path pathLength="1" d="m36 33 9 9"/><path pathLength="1" d="m36 33-3-13"/></g><g fill="currentColor"><circle cx="26" cy="28" r="2.6"/><circle cx="33" cy="20" r="2.6"/><circle cx="44" cy="25" r="2.6"/><circle cx="36" cy="33" r="3.2"/><circle cx="27" cy="42" r="2.6"/><circle cx="45" cy="42" r="2.6"/></g></svg><div class="preview-window" role="img" aria-label="Example evaluation report, showing three of four tasks passed. Illustrative results only."><div class="window-chrome"><i></i><i></i><i></i><span>EXAMPLE REPORT</span></div><div class="preview-body"><div class="preview-repo"><span class="repo-icon">${icon('repo')}</span> your-workspace / my-agent</div><div class="evaluation-score"><strong>3<span> / 4</span></strong><span>Tasks passed</span></div><div class="evaluation-row"><span>Fix a bug</span><span class="pass-label">${icon('check')} Passed</span></div><div class="evaluation-row"><span>Write tests</span><span class="pass-label">${icon('check')} Passed</span></div><div class="evaluation-row"><span>Update an API</span><span class="fail-label">Needs work</span></div><div class="evaluation-row"><span>Build a feature</span><span class="pass-label">${icon('check')} Passed</span></div><div class="evaluation-footer">Results, model calls, and every step in between.</div></div></div></div></section><div class="simple-steps" aria-label="How it works"><span><b>01</b> Connect your repository</span><span><b>02</b> Run an evaluation</span><span><b>03</b> Explore your results</span></div>`);
  }
  function signIn() {
    document.title = 'Connect with GitHub · Harness Report';
    flow(1, `${heading(1, 'Sign in with GitHub.', 'Your code is the starting point.')}<div class="flow-card signin-card"><div class="signin-mark">${icon('github')}</div><button class="ui-btn primary wide" id="github-signin">${icon('github')} Continue with GitHub ${icon('arrow')}</button><p class="signin-meta">${live() ? 'You will be sent to GitHub to authorise Harness Report.' : 'Sample workspace · No account required for this preview.'}</p></div>`);
    document.getElementById('github-signin').onclick = () => {
      if (live()) { location.href = '/auth/github'; return; }
      state.connected = true; save(); navigate('/import');
    };
  }
  function repositoryPicker() {
    document.title = 'Import a harness · Harness Report';
    flow(2, `${heading(2, 'Choose your harness.', 'Select a repository or paste its GitHub URL.')}<div class="flow-card"><div class="account-bar"><span class="avatar">${live() && session.user.avatar ? `<img src="${escape(session.user.avatar)}" alt="" width="26" height="26">` : icon('github')}</span><span class="account-name">${live() ? escape(session.user.login) : 'your-workspace'} <span>${live() ? 'GitHub account' : 'Sample GitHub account'}</span></span><a class="text-link" href="${live() ? '/auth/logout' : '#connect'}">${live() ? 'Sign out' : 'Switch account'}</a></div><div class="search-wrap">${icon('search')}<input id="repo-search" type="search" placeholder="Find a repository…" aria-label="Find a repository" autocomplete="off"></div><div class="repo-list" id="repo-list"></div><div class="import-divider">or import by URL</div><form class="repo-form" id="repo-form" novalidate><label for="repo-url">GitHub repository URL</label><div class="repo-input-row"><input id="repo-url" type="url" placeholder="https://github.com/your-workspace/my-agent" autocomplete="off" aria-describedby="repo-url-error"><button class="ui-btn" type="submit">Import ${icon('arrow')}</button></div><p id="repo-url-error" class="field-error" role="alert" hidden></p></form></div><p class="flow-bottom-note">${icon('lock')} ${live() ? 'Only the repositories you install Harness Report on' : 'Sample repositories · Preview only'}</p>`);
    const list = document.getElementById('repo-list');
    let source = live() ? [] : repos;
    function drawRepos(query = '') {
      const filtered = source.filter(repo => repo.name.toLowerCase().includes(query.toLowerCase().trim()));
      if (!filtered.length && live()) return list.innerHTML = installOffer(`No repository matches “${escape(query.trim())}”. Paste its URL below, or:`);
      list.innerHTML = filtered.length ? filtered.map(repo => `<button class="repo-option" data-repo="${escape(repo.name)}" aria-label="Import ${escape(repo.name)}"><span class="repo-icon">${icon('repo')}</span><span class="repo-info"><strong>${escape(repo.name.split('/')[1])}</strong><small>${escape(repo.language)} · ${escape(repo.description)}</small></span><span class="repo-visibility">${escape(repo.visibility)}</span>${icon('arrow')}</button>`).join('') : '<p class="repo-empty" role="status">No repositories found. Try another name or paste a GitHub URL below.</p>';
      list.querySelectorAll('[data-repo]').forEach(button => button.onclick = () => selectRepo(button.dataset.repo));
    }
    if (live()) {
      list.innerHTML = '<p class="repo-empty" role="status">Loading your repositories…</p>';
      loadRepos().then(found => {
        source = found;
        if (!found.length) return list.innerHTML = installOffer('Paste a public repository URL below — or, for a private one:');
        drawRepos(document.getElementById('repo-search').value || '');
      }).catch(() => { list.innerHTML = installOffer('Could not reach GitHub. Paste a repository URL below, or try again:'); });
    } else drawRepos();
    document.getElementById('repo-search').oninput = event => drawRepos(event.target.value);
    document.getElementById('repo-form').onsubmit = event => {
      event.preventDefault();
      const input = document.getElementById('repo-url');
      const error = document.getElementById('repo-url-error');
      const value = input.value.trim();
      let match;
      try {
        const url = new URL(value);
        if (url.protocol === 'https:' && url.hostname === 'github.com' && !url.port && !url.username && !url.password && !url.search && !url.hash) match = url.pathname.match(/^\/([a-z\d](?:[a-z\d-]{0,38}))\/([a-z\d_.-]+?)\/?$/i);
      } catch {}
      if (!match || ['', '.', '..'].includes(match[2].replace(/\.git$/, ''))) {

        input.focus();
        return;
      }
      selectRepo(`${match[1]}/${match[2].replace(/\.git$/, '')}`);
    };
  }
  const installOffer = (lead) => `<p class="repo-empty" role="status">${lead}${session.install_url ? ` <a class="text-link" href="${escape(session.install_url)}">Install Harness Report on a repository ${icon('arrow')}</a>` : ''}</p>`;
  async function loadRepos() {
    const installs = await api('/api/github/installations');
    const lists = await Promise.all(installs.map(i => api('/api/github/repos?installation=' + encodeURIComponent(i.id))));
    return lists.flat().map(r => ({ name: r.name, language: r.language || 'Repository',
                                    description: r.description || '', visibility: r.private ? 'Private' : 'Public' }));
  }
  function selectRepo(repo) { state.repo = repo; state.result = null; save(); navigate('/check'); }
  function checkSetup() {
    document.title = 'Run your first task · Harness Report';
    flow(3, `${heading(3, 'Run your first task.', 'Start with FizzBuzz, then build from there.')} ${repoSummary()}<div class="flow-card"><div class="check-card-header"><span class="task-symbol">${icon('terminal')}</span><div><h3>FizzBuzz</h3><p>A quick first run.</p></div></div><div class="check-card-body"><p class="task-description">Create a Python program that prints FizzBuzz from 1 to 15, then run it.</p><div class="expected-output"><span>EXPECTED OUTPUT</span><code>${output}</code></div></div><div class="check-actions"><span>Simulated run</span><button class="ui-btn primary" id="run-check">${icon('play')} Run task</button></div></div>`);
    document.getElementById('run-check').onclick = startCheck;
  }
  function stageRows(completed) {
    return stages.map(([title, desc], i) => `<div class="check-stage ${i < completed ? 'done' : i === completed ? 'active' : ''}"><span class="check-stage-indicator">${i < completed ? icon('check') : i === completed ? '<span class="spinner"></span>' : '<span>·</span>'}</span><div><strong>${title}</strong><small>${desc}</small></div><span>${i < completed ? 'DONE' : i === completed ? 'RUNNING' : 'QUEUED'}</span></div>`).join('');
  }
  function startCheck() {
    state.result = null; save(); active = true;
    history.replaceState({}, '', '#check');
    flow(3, `${heading(3, 'Running FizzBuzz…', 'Follow your agent’s progress.')} ${repoSummary(false)}<div class="flow-card" aria-busy="true" id="progress-card"><div class="check-card-header"><span class="task-symbol">${icon('terminal')}</span><div><h3>FizzBuzz</h3><p>Simulated run · ${escape(state.repo.split('/')[1])}</p></div></div><div class="check-progress" role="progressbar" aria-label="Setup check progress" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><div style="width:5%"></div></div><div class="check-status" id="check-status">${stageRows(0)}</div><div class="live-note" id="check-announcement" role="status" aria-live="polite">Preview: fetching the repository…</div></div><p class="flow-helper"><button class="ui-btn small" id="cancel-check">Cancel run</button></p>`);
    focusHeading();
    document.getElementById('cancel-check').onclick = () => { clearTimers(); active = false; checkSetup(); focusHeading(); };
    [1, 2, 3, 4].forEach(step => timers.push(setTimeout(() => {
      if (!active) return;
      const status = document.getElementById('check-status');
      if (!status) return;
      status.innerHTML = stageRows(step);
      const progress = document.querySelector('.check-progress');
      progress.setAttribute('aria-valuenow', String(step));
      progress.firstElementChild.style.width = `${step * 25}%`;
      document.getElementById('check-announcement').textContent = step < 4 ? `Preview: ${stages[step][0].toLowerCase()}…` : 'Preview check complete. Opening the example report…';
      if (step === 4) timers.push(setTimeout(() => { active = false; state.result = 'example-passed'; save(); navigate('/check/result'); }, 550));
    }, step * 1300)));
  }
  function result() {
    document.title = 'First task complete · Harness Report';
    flow(4, `<div class="success-heading"><span class="success-symbol">${icon('check')}</span><div><h1 tabindex="-1">First task complete.</h1><p>FizzBuzz · Example result</p></div></div>${repoSummary()}<div class="flow-card"><div class="result-banner"><strong>FizzBuzz</strong><span class="pass-label">${icon('check')} Example pass</span></div><div class="result-details"><dl class="result-facts"><div><dt>TASK RESULT</dt><dd>Passed</dd></div><div><dt>MODEL CALLS</dt><dd>6</dd></div><div><dt>RUN TIME</dt><dd>21s</dd></div></dl><p class="flow-bottom-note" style="justify-content:flex-start;margin-top:0!important">Illustrative results · Preview only</p><div class="result-checks"><span>${icon('check')} Repository fetched</span><span>${icon('check')} Model connection verified</span><span>${icon('check')} Environment prepared</span><span>${icon('check')} Output matches expected result</span></div><div class="expected-output"><span>EXAMPLE OUTPUT · FIZZBUZZ 1–15</span><code>${output}</code></div><details><summary>View example check log</summary><pre>[preview] Repository fetched: ${escape(state.repo)}
[preview] Isolated environment prepared
[preview] Model connection established
[preview] Task: create and run FizzBuzz for 1–15
[preview] Output matches all 15 expected values
[preview] Setup check passed

This is an example log, not an actual execution trace.</pre></details></div></div><div class="result-links"><a class="text-link" href="#runs">View evaluations</a><button id="rerun-check">Run again</button><a href="#import" class="text-link">Choose another harness</a></div>`);
    document.getElementById('rerun-check').onclick = () => { state.result = null; save(); navigate('/check'); };
  }
  function render() {
    clearTimers(); active = false;
    const path = '/' + location.hash.slice(1).replace(/^\/|\/$/g, '');
    if (!['/', '/connect', '/login', '/import', '/check', '/check/result'].includes(path)) return false;
    document.body.classList.add('product-page');
    const signin = document.querySelector('[data-nav=account]');
    signin.textContent = signedIn() ? 'Your harness' : 'Sign in';
    signin.href = signedIn() ? '#import' : '#connect';
    if (path === '/') landing();
    else if ((path === '/connect' || path === '/login') && !signedIn()) signIn();
    else if (path === '/connect' || path === '/login') { history.replaceState({}, '', '#import'); repositoryPicker(); }
    else if (!signedIn()) { history.replaceState({}, '', '#connect'); signIn(); }
    else if (path === '/import') repositoryPicker();
    else if (!state.repo) { history.replaceState({}, '', '#import'); repositoryPicker(); }
    else if (path === '/check/result' && state.result === 'example-passed') result();
    else { if (path !== '/check') history.replaceState({}, '', '#check'); checkSetup(); }

  }
  return { render, shell, focusHeading, setSession(me) { session = me; } };

<script>
window.RunViewer = (() => {

'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '—' : Number(n).toLocaleString();
const kb = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
let app, crumb, controller, revision = 0;

function cancel() { revision++; controller?.abort(); }
async function getJSON(url) {

}
function showError(message, version) {

  $('#retry-runs').onclick = () => render(location.hash.slice(1));
}
function render(route) {
  cancel(); controller = new AbortController();

  const [path, query = ''] = route.split('?');

    try { showRun(decodeURIComponent(path.slice(5)), version, new URLSearchParams(query).get('tab')); }
    catch { showError('This run link is invalid.', version); }
  } else {
    document.title = 'Page not found · Harness Report';
    app.innerHTML = '<div class="empty-card"><h1>Page not found.</h1><p><a href="#runs">View evaluations</a></p></div>';

}

// ---------------------------------------------------------------- index
// Each row is one runs/<run-id>/run.json: origin fields (kind, harness, task|prompt, model) + result fields once finished.
async function showIndex(version) {
  document.title = 'Evaluations · Harness Report';

  app.innerHTML = `<div class="run-list-head"><div><h1>Evaluations</h1><p>${runs.length} recorded run${runs.length === 1 ? '' : 's'}</p></div><a class="ui-btn primary" href="#connect">Connect harness ↗</a></div>
    ${runs.length ? '<div class="search-wrap"><input type="search" id="run-search" aria-label="Search runs" placeholder="Search harnesses, tasks, or runs…"></div><div id="run-list"></div>' : '<div class="empty-card"><h2>No runs yet</h2><p>Your recorded evaluations will appear here.</p><a class="ui-btn" href="#connect">Connect your harness</a></div>'}`;
  if (!runs.length) return;
  function draw(query = '') {
    const filtered = runs.filter(r => [r.run, r.harness?.name, taskText(r), r.model].join(' ').toLowerCase().includes(query.trim().toLowerCase()));

      ${filtered.map(r => `<tr class="row" data-run="${esc(r.run)}"><td><a class="run-name" href="#runs/${encodeURIComponent(r.run)}">${esc(r.harness?.name || r.run)}</a><span class="run-id" title="${esc(r.run)}">${esc(r.run)}</span></td><td class="run-task">${esc(taskText(r).slice(0, 100))}${taskText(r).length > 100 ? '…' : ''}</td><td>${evaluationStatus(r)}</td><td class="num">${fmt(r.calls)}</td><td class="num">${fmt(r.input_tokens)} / ${fmt(r.output_tokens)}</td><td class="num">${r.seconds == null ? '—' : esc(r.seconds) + 's'}</td></tr>`).join('')}

    $('#run-list').querySelectorAll('[data-run]').forEach(row => row.onclick = event => {

}
function evaluationStatus(r) {
  let text, tone;
  if (!r.has_run_json) [text, tone] = ['No result', 'warn'];
  else if (!r.finished) [text, tone] = ['Unfinished', 'warn'];
  else if (r.rc !== 0 || r.errors) [text, tone] = ['Error', 'bad'];
  else if (r.kind !== 'harbor') [text, tone] = ['Completed', 'ok'];
  else if (r.reward == null) [text, tone] = ['No result', 'warn'];
  else if (Number(r.reward) === 1) [text, tone] = ['Passed', 'ok'];
  else if (Number(r.reward) > 0) [text, tone] = ['Partial', 'warn'];

  return `<span class="pill ${tone}">${text}</span>`;
}
function shortModel(m) { return (m || '').replace(/^bedrock\//, '').replace(/^us\.anthropic\./, ''); }
function taskText(r) { return r.kind === 'harbor' ? `${r.task?.taskset || ''} / ${r.task?.name || ''}` : (r.prompt || ''); }
function kindPill(r) { return r.kind ? `<span class="pill">${esc(r.kind)}</span>` : '<span class="pill warn">no run.json</span>'; }
function statusPill(r) {
  if (!r.has_run_json) return '<span class="pill warn">no run.json</span>';
  if (!r.finished) return '<span class="pill warn">unfinished</span>';
  if (r.rc === 0) return `<span class="pill ok">rc 0</span>${r.errors ? ` <span class="pill bad">${r.errors} proxy err</span>` : ''}`;
  return `<span class="pill bad">rc ${esc(r.rc)}</span>`;
}
function testsCell(t) {  // verifier test counts, e.g. 29 / 31; only Harbor runs whose verifier printed pytest -v lines have them
  if (t?.aborted) return `<span class="pill warn" title="${esc(t.aborted)}">aborted</span>`;
  if (!t || !t.total) return '<span class="muted">—</span>';
  return `<span class="pill ${t.failed ? 'bad' : 'ok'}" title="${esc(t.summary || '')}">${t.passed} / ${t.total}</span>${t.agent_written ? `<span class="muted small" title="test files the agent itself left in the workdir; pytest ran them too but they are not the task's tests"> +${t.agent_written} own</span>` : ''}`;
}
function rewardCell(r) {
  if (r.kind !== 'harbor') return '<span class="muted">—</span>';
  if (r.reward == null) return r.finished ? '<span class="pill warn">none</span>' : '<span class="muted">…</span>';
  return `<span class="pill ${Number(r.reward) > 0 ? 'ok' : 'bad'}">${esc(r.reward)}</span>`;
}

// ---------------------------------------------------------------- one run
async function showRun(rid, version, selectedTab) {
  let b; try { b = await getJSON(`/api/run/${encodeURIComponent(rid)}`); }
  catch (e) { if (e.name !== 'AbortError') showError('This run could not be loaded.', version); return; }
  if (version !== revision) return;
  const rj = b.run_json, h = rj.harness || {}, t = rj.task || {}, calls = b.calls, harbor = rj.kind === 'harbor';
  document.title = `${b.run} · ${h.name || ''}`;
  crumb.innerHTML = `<a href="#runs">Evaluations</a> / ${esc(b.run)}`;
  const repoLink = h.repo ? `<a href="${esc(h.repo)}${h.commit ? '/tree/' + esc(h.commit) : ''}" target="_blank" rel="noopener">${esc(h.repo.replace('https://github.com/', ''))}</a>` : '—';
  const calc = { in: calls.reduce((a, c) => a + (c.usage?.input_tokens || 0), 0), out: calls.reduce((a, c) => a + (c.usage?.output_tokens || 0), 0), err: calls.filter(c => c.error).length, ms: calls.reduce((a, c) => a + (c.latency_ms || 0), 0) };

  app.innerHTML = `
    <h1 class="mono">${esc(b.run)}</h1>
    <div class="muted">${kindPill(rj)} ${repoLink}${h.commit ? ` <span class="mono small">@ ${esc(h.commit.slice(0, 10))}</span>` : ''} · ${statusPill(rj)}${harbor ? ' · reward ' + rewardCell(rj) + (rj.tests?.total || rj.tests?.aborted ? ' · tests ' + testsCell(rj.tests) : '') : ''}</div>
    <h2><span class="help" title="The half of run.json written before anything ran: what harness, what task, what model. A run that died mid-way still has this.">Origin</span></h2>
    <div class="facts">
      ${fact('kind', rj.kind)}${fact('harness', h.name)}${fact('api', h.api_style)}
      ${harbor ? fact('taskset', t.taskset) + fact('task', t.name) : fact('task', 'prompt (below)')}
      ${fact('model', shortModel(rj.model))}${fact('workdir', rj.workdir)}${fact('started', rj.started)}
    </div>
    ${harbor && t.taskset_dir ? `<p class="muted small mono">task folder: ${esc(t.taskset_dir)}/${esc(t.name)}</p>` : ''}
    <h2><span class="help" title="The half of run.json merged in when the run ended: exit code, timing, reward, and the call and token totals from the proxy.">Result</span></h2>
    <div class="facts">
      ${fact('finished', rj.finished || 'not yet')}${fact('exit code', rj.rc)}${fact('wall time', rj.seconds != null ? rj.seconds + ' s' : null)}
      ${harbor ? fact('reward', rj.reward) + fact('verifier rc', rj.verifier_rc) + (rj.tests?.total ? fact('tests', `${rj.tests.passed} passed, ${rj.tests.failed} failed, ${rj.tests.total} total`) : '') : ''}
      ${fact('model calls', calls.length + (b.calls_unparsed ? ` (+${b.calls_unparsed} unparsed)` : ''))}${fact('tokens in', fmt(calc.in))}${fact('tokens out', fmt(calc.out))}
      ${fact('model time', (calc.ms / 1000).toFixed(1) + ' s')}${fact('proxy errors', calc.err)}
      ${fact('model requested', calls[0]?.model_requested)}${fact('first call', calls[0]?.ts)}
    </div>
    <h2>${harbor ? 'Instruction' : 'Prompt'}</h2><div class="task">${esc(b.task || rj.prompt || '(no task.txt)')}</div>
    <nav class="tabs">
      <button data-t="traj" class="on">Trajectory</button>
      <button data-t="calls">Calls<span class="n">${calls.length}</span></button>
      ${harbor ? '<button data-t="verifier">Verifier</button>' : ''}
      <button data-t="logs">Logs</button>
      <button data-t="recipe">Recipe</button>
      <button data-t="run">run.json</button>
      <button data-t="files">Files<span class="n">${b.files.length}</span></button>
    </nav>
    <section class="panel on" id="p-traj"></section>
    <section class="panel" id="p-calls"></section>
    <section class="panel" id="p-verifier"></section>
    <section class="panel" id="p-logs"></section>
    <section class="panel" id="p-recipe"></section>
    <section class="panel" id="p-run"><h2>run.json <span class="muted" style="text-transform:none;letter-spacing:0">origin written before the run, result merged in after</span></h2><pre>${esc(JSON.stringify(rj, null, 2))}</pre></section>
    <section class="panel" id="p-files"></section>`;

  $('nav.tabs').addEventListener('click', e => {
    const bt = e.target.closest('button'); if (!bt) return;
    document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === bt));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + bt.dataset.t));
    history.replaceState({}, '', '#runs/' + encodeURIComponent(rid) + '?tab=' + bt.dataset.t);
  });
  renderTrajectory(b); renderCalls(b); renderRecipe(b); renderLogs(b); renderFiles(b); if (harbor) renderVerifier(b);
  const selected = [...document.querySelectorAll('nav.tabs button')].find(button => button.dataset.t === selectedTab);
  if (selected) selected.click();
}
// Definitions shown as hover tooltips on fact labels and table headers. Keep them in one place.
const HELP = {
  'kind': 'prompt: the task was free text; nothing verifies it unless the run was judged. harbor: a Harbor task folder; the task\'s own tests/test.sh grades the result.',
  'reward': 'What the verifier wrote to reward.txt. Harbor: 1 = all tests passed, 0 = not (some tasks give a fraction). LLM judge: fraction of rubric criteria met, 0 to 1. Not an exit code.',
  'tests': 'passed / total test cases from the verifier\'s pytest -v output (verifier/stdout.log). The reward is all-or-nothing, so 29 / 31 still scores 0. Only the task\'s own test files count; tests the agent wrote itself are shown as +N own. Empty when the verifier did not print per-test lines.',
  'verifier rc': 'Exit status of the verifier process itself (tests/test.sh, or the judge step), separate from the reward. 0 = it ran to completion. 124 or 142 = it hit its timeout. Anything else = the verifier broke. reward 0 with rc 0 is a clean fail; no reward with rc != 0 is an infrastructure problem, not an agent failure.',
  'exit code': 'The harness\'s own exit status inside the sandbox (rc in run.json). 124 or 142 = the agent hit its time budget. Says nothing about whether the task was solved; the reward does.',
  'status': 'rc = the harness\'s exit status inside the sandbox. unfinished = run.json has no result half yet (still running, or the runner died). proxy err = model calls the proxy could not complete upstream.',
  'wall time': 'Seconds for the agent phase only: from starting the run command to its exit. The verifier is not included.',
  's': 'Seconds for the agent phase only, verifier not included.',
  'model calls': 'Requests the harness made to the model, as recorded by the proxy on the wire (one line each in calls.jsonl).',
  'calls': 'Model requests recorded by the proxy (lines in calls.jsonl).',
  'tokens in': 'Input tokens summed over all calls, from the model\'s usage report. Each turn resends the whole conversation, so this grows quadratically with the number of turns.',
  'tokens out': 'Output tokens summed over all calls, from the model\'s usage report.',
  'tokens in / out': 'Input and output tokens summed over all recorded calls, from the model\'s usage report. Input counts the whole conversation resent on every turn.',
  'model time': 'Sum of the per-call latency the proxy measured (request in to response out). The rest of wall time is the harness running commands.',
  'proxy errors': 'Calls the proxy could not complete upstream (Bedrock error or timeout). The harness saw an error response for these.',
  'model requested': 'The model name the harness sent on the wire. The proxy replaced it with the configured model; see run.json model.',
  'model': 'The model the proxy actually called, from .env MODEL. The name the harness asked for is under model requested.',
  'api': 'Which API shape the harness spoke to the proxy: openai (chat completions) or anthropic (messages). From the recipe.',
  'workdir': 'Directory the agent ran in inside the sandbox. Harbor: the task image\'s WORKDIR. Prompt: the recipe\'s workdir, usually /work.',
  'harness': 'owner-repo slug of the GitHub repo that was packaged; the recipe and overlay image are cached under this name.',
  'taskset': 'The Harbor taskset directory the task came from.',
  'task': 'Harbor: the task folder name. Prompt: the text given on the command line (shown in full below).',
  'started': 'When run.sh wrote the origin half of run.json, just before the proxy started.',
  'finished': 'When the result half was merged into run.json, after the verifier (if any). "not yet" means the run is still going or the runner died.',
  'first call': 'Timestamp of the first model call the proxy recorded.',
  'run': 'Folder name under runs/: timestamp or --run-id, plus -<task> and -k<i> for a Harbor task.',
};
function label(k) { return HELP[k] ? `<span class="help" title="${esc(HELP[k])}">${esc(k)}</span>` : esc(k); }
function fact(k, v) { return `<div class="fact"><div class="k">${label(k)}</div><div class="v">${v == null || v === '' ? '—' : esc(v)}</div></div>`; }

// ---------------------------------------------------------------- trajectory (reconstructed from one call's request + response)
// In an agent loop every request carries the whole conversation so far, so the last call is the full trajectory.
function renderTrajectory(b) {
  const el = $('#p-traj'), calls = b.calls;
  if (!calls.length) { el.innerHTML = '<div class="empty">no model calls were recorded (calls.jsonl is empty or missing).</div>'; return; }
  const draw = idx => {
    const c = calls[idx];
    el.innerHTML = `<div class="toolbar">conversation as sent in call
      <select id="callpick">${calls.map((x, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${x.n ?? i + 1} of ${calls.length}${x.error ? ' (error)' : ''}</option>`).join('')}</select>
      <span>· ${c.route} · ${fmt(c.usage?.input_tokens)} in / ${fmt(c.usage?.output_tokens)} out · ${fmt(c.latency_ms)} ms</span>
      <label><input type="checkbox" id="showsys" checked> system prompt</label></div>
      <div id="msgs">${conversation(c).map(msgHTML).join('')}</div>`;
    $('#callpick', el).onchange = e => draw(+e.target.value);
    $('#showsys', el).onchange = e => el.querySelectorAll('.msg.system').forEach(m => m.style.display = e.target.checked ? '' : 'none');
    wireClips(el);
  };
  draw(calls.length - 1);
}

// Normalise both API shapes to [{role, text, calls:[{name,args,pretty}], results:[{id,text}], final}]
function conversation(c) {
  const req = c.request || {}, out = [];
  const text = v => typeof v === 'string' ? v : Array.isArray(v) ? v.map(p => typeof p === 'string' ? p : p?.type === 'text' ? p.text : p?.type === 'image_url' || p?.type === 'image' ? '[image]' : JSON.stringify(p)).join('\n') : v == null ? '' : JSON.stringify(v);
  if (c.route === 'openai') {
    for (const m of req.messages || []) {
      if (m.role === 'system' || m.role === 'developer') out.push({ role: 'system', text: text(m.content) });
      else if (m.role === 'user') out.push({ role: 'user', text: text(m.content) });
      else if (m.role === 'assistant') out.push({ role: 'assistant', text: text(m.content), calls: (m.tool_calls || []).map(tc => toolCall(tc.function?.name, tc.function?.arguments)) });
      else if (m.role === 'tool') out.push({ role: 'tool', results: [{ id: m.tool_call_id, text: text(m.content) }] });
      else out.push({ role: m.role, text: text(m.content) });
    }
    const rm = c.response?.choices?.[0]?.message;
    if (rm) out.push({ role: 'assistant', final: true, text: text(rm.content), calls: (rm.tool_calls || []).map(tc => toolCall(tc.function?.name, tc.function?.arguments)) });
  } else {
    if (req.system) out.push({ role: 'system', text: text(req.system) });
    const blocks = m => {
      const bs = Array.isArray(m.content) ? m.content : [{ type: 'text', text: m.content }];
      const r = { role: m.role, text: '', calls: [], results: [] };
      for (const bl of bs) {
        if (bl.type === 'text') r.text += (r.text ? '\n' : '') + bl.text;
        else if (bl.type === 'tool_use') r.calls.push(toolCall(bl.name, bl.input));
        else if (bl.type === 'tool_result') r.results.push({ id: bl.tool_use_id, text: text(bl.content), is_error: bl.is_error });
        else if (bl.type === 'thinking') r.text += (r.text ? '\n' : '') + '[thinking] ' + (bl.thinking || '');
        else r.text += (r.text ? '\n' : '') + JSON.stringify(bl);
      }
      if (m.role === 'user' && r.results.length && !r.text) r.role = 'tool';
      return r;
    };
    for (const m of req.messages || []) out.push(blocks(m));
    if (c.response?.content) out.push({ ...blocks({ role: 'assistant', content: c.response.content }), final: true });
  }
  if (c.error) out.push({ role: 'assistant', final: true, error: c.error });
  return out;
}
function toolCall(name, args) {
  let a = args, pretty = null;
  if (typeof a === 'string') { try { a = JSON.parse(a); } catch { pretty = a; } }
  if (pretty == null && a && typeof a === 'object') {
    const keys = Object.keys(a);
    const main = a.command ?? a.cmd ?? a.code ?? a.script ?? null;
    pretty = (keys.length === 1 && typeof main === 'string') ? main : JSON.stringify(a, null, 2);
  }
  return { name: name || 'tool', pretty: pretty ?? String(args ?? '') };
}
function msgHTML(m) {
  const role = m.role === 'tool' ? 'tool' : m.role, label = m.final ? 'assistant<br><span class="muted">(reply)</span>' : role === 'tool' ? 'observation' : role;
  let body = '';
  if (m.error) body += `<div class="err">proxy error: ${esc(m.error)}</div>`;
  if (m.text) body += `<div class="text">${clipHTML(m.text, role === 'system' ? 900 : 4000)}</div>`;
  for (const c of m.calls || []) body += `<pre class="cmd"><span class="muted">${esc(c.name)} $</span> ${esc(c.pretty)}</pre>`;
  for (const r of m.results || []) { const o = observation(r.text); body += `<pre class="obs${r.is_error ? ' err' : ''}">${o.head ? `<span class="muted">${esc(o.head)}</span>\n` : ''}${clipHTML(o.text, 2500, true)}</pre>`; }
  if (!body) body = '<span class="muted">(empty)</span>';
  return `<div class="msg ${esc(role)}"><div class="role">${label}</div><div class="body">${body}</div></div>`;
}
// Tool results are often JSON like {"returncode":0,"output":"..."}; show the output as text with the rest as a one-line head.
function observation(t) {
  try { const o = JSON.parse(t); if (o && typeof o === 'object' && !Array.isArray(o)) {
    const k = ['output', 'stdout', 'result', 'content', 'text'].find(k => typeof o[k] === 'string');
    if (k) { const rest = Object.entries(o).filter(([x]) => x !== k).map(([x, v]) => `${x}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join('  '); return { head: rest, text: o[k] }; }
  } } catch {}
  return { head: '', text: t };
}
// Long text is clipped with a "show all" button; the full text is kept in a data attribute.
function clipHTML(s, n, raw) {
  s = String(s); if (s.length <= n) return esc(s);
  return `<span class="clipped">${esc(s.slice(0, n))}</span><span class="rest" hidden>${esc(s.slice(n))}</span>${raw ? '\n' : ''}<button class="more" data-n="${s.length - n}">… show ${fmt(s.length - n)} more chars</button>`;
}
function wireClips(root) {
  root.querySelectorAll('button.more').forEach(bt => bt.onclick = () => { const rest = bt.previousElementSibling; rest.hidden = !rest.hidden; bt.textContent = rest.hidden ? `… show ${fmt(bt.dataset.n)} more chars` : 'show less'; });
}

// ---------------------------------------------------------------- calls table with raw request/response per call
function renderCalls(b) {
  const el = $('#p-calls'), calls = b.calls;
  if (!calls.length) { el.innerHTML = '<div class="empty">no calls recorded.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th class="num">#</th><th>time</th><th>route</th><th>path</th><th>requested → used</th><th>stream</th><th class="num">ms</th><th class="num">in</th><th class="num">out</th><th>msgs</th><th>stop</th><th>error</th></tr></thead>
    <tbody>${calls.map((c, i) => `<tr class="row" data-i="${i}"><td class="num">${c.n ?? i + 1}</td><td class="mono small">${esc((c.ts || '').replace('T', ' '))}</td><td>${esc(c.route)}</td><td class="mono small">${esc(c.path)}</td>
      <td class="mono small">${esc(c.model_requested)} → ${esc(shortModel(c.model))}</td><td>${c.stream ? 'yes' : ''}</td><td class="num">${fmt(c.latency_ms)}</td><td class="num">${fmt(c.usage?.input_tokens)}</td><td class="num">${fmt(c.usage?.output_tokens)}</td>
      <td class="num">${(c.request?.messages || []).length}</td><td class="mono small">${esc(stopReason(c))}</td><td class="err small">${esc(c.error || '')}</td></tr>
      <tr class="detail" data-i="${i}" hidden><td colspan="12"><details open><summary>request</summary><pre>${esc(JSON.stringify(c.request, null, 2))}</pre></details><details open><summary>response</summary><pre>${esc(JSON.stringify(c.response ?? c.error, null, 2))}</pre></details></td></tr>`).join('')}</tbody></table>`;
  el.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => { const d = el.querySelector(`tr.detail[data-i="${tr.dataset.i}"]`); d.hidden = !d.hidden; });
}
function stopReason(c) { return c.response?.choices?.[0]?.finish_reason ?? c.response?.stop_reason ?? ''; }

// ---------------------------------------------------------------- recipe
function renderRecipe(b) {
  const el = $('#p-recipe'), r = b.recipe;
  if (!r) { el.innerHTML = '<div class="empty">no recipe.json in this run.</div>'; return; }
  el.innerHTML = `
    ${r.summary ? `<h2>Summary</h2><div class="text">${esc(r.summary)}</div>` : ''}
    <div class="facts">${fact('api style', r.api_style)}${fact('base image', r.base_image)}${fact('ad-hoc workdir', r.workdir || '/work')}</div>
    <h2>Run command</h2><pre>${esc(b.command || r.run_command || '')}</pre>
    ${r.check_command ? `<h2>Check command</h2><pre>${esc(r.check_command)}</pre>` : ''}
    <h2>Environment</h2><table><thead><tr><th>name</th><th>value</th></tr></thead><tbody>${(r.env || []).map(e => `<tr><td class="mono">${esc(e.name)}</td><td class="mono">${esc(e.value)}</td></tr>`).join('')}</tbody></table>
    ${r.dockerfile ? `<h2>Dockerfile</h2><pre>${esc(r.dockerfile)}</pre>` : ''}
    ${r.notes ? `<h2>Notes</h2><div class="text" style="white-space:pre-wrap">${esc(r.notes)}</div>` : ''}`;
}

// ---------------------------------------------------------------- logs
function renderLogs(b) {
  const el = $('#p-logs');
  const block = logBlock;
  el.innerHTML = block('stdout.log', b.stdout) + block('stderr.log', b.stderr) + block('proxy.log', b.proxy);
}
function logBlock(title, s) { return `<h2>${title} <span class="muted" style="text-transform:none;letter-spacing:0">${s == null ? '(missing)' : kb(new Blob([s]).size)}</span></h2>${s ? `<pre>${esc(s)}</pre>` : '<div class="muted small">empty</div>'}`; }

// ---------------------------------------------------------------- verifier (Harbor runs: tests/test.sh output and the reward it wrote)
function renderVerifier(b) {
  const el = $('#p-verifier'), v = b.verifier, rj = b.run_json;
  if (!v) { el.innerHTML = '<div class="empty">no verifier/ folder: the run did not reach the verify stage.</div>'; return; }
  const t = v.tests;
  el.innerHTML = `<div class="facts">${fact('reward', (v['reward.txt'] || '').trim() || null)}${fact('verifier rc', rj.verifier_rc)}${fact('taskset', rj.task?.taskset)}${fact('task', rj.task?.name)}
      ${t?.total ? fact('tests', `${t.passed} passed, ${t.failed} failed, ${t.total} total`) : ''}${t?.aborted ? fact('tests', 'aborted: ' + t.aborted) : ''}</div>
    ${t?.aborted ? `<p class="small muted">pytest stopped before running any test: <span class="mono">${esc(t.aborted)}</span>. Usually a file the agent left in the workdir that fails at import; the task's own tests never ran, so the reward says nothing about the solution.</p>` : ''}
    ${t?.total ? `<p class="small muted">The task's own test suite, run by <code>tests/test.sh</code> in the sandbox after the agent finished. Reward is 1 only when every test passes.${t.summary ? ` pytest: <span class="mono">${esc(t.summary)}</span>` : ''}${t.agent_written ? ` pytest also collected ${t.agent_written} test${t.agent_written === 1 ? '' : 's'} from files the agent wrote itself; they are not counted here.` : ''}</p>` : ''}
    ${t?.cases?.length ? `<h2>tests <span class="muted" style="text-transform:none;letter-spacing:0">${t.cases.length}, click one for its source and, if it failed, the traceback</span></h2>
      <table><thead><tr><th>#</th><th>result</th><th>test</th><th>file</th></tr></thead><tbody>
      ${t.cases.map((c, i) => `<tr class="row" data-i="${i}"><td class="num">${i + 1}</td><td><span class="pill ${/PASS/.test(c.result) ? 'ok' : /FAIL|ERROR/.test(c.result) ? 'bad' : 'warn'}">${esc(c.result)}</span></td>
        <td class="mono small">${esc(c.name)}</td><td class="mono small">${esc(c.file)}${c.own ? '' : ' <span class="muted">(agent-written, not counted)</span>'}</td></tr>
        <tr class="detail" id="tc-${i}" style="display:none"><td></td><td colspan="3">${c.source ? `<div class="muted small">source</div><pre>${esc(c.source)}</pre>` : '<div class="muted small">source not available (task folder not readable from here)</div>'}${c.detail ? `<div class="muted small">failure</div><pre>${esc(c.detail)}</pre>` : ''}</td></tr>`).join('')}
      </tbody></table>` : ''}
    ${logBlock('verifier/stdout.log', v['stdout.log'])}${logBlock('verifier/stderr.log', v['stderr.log'])}`;
  el.querySelectorAll('tr.row').forEach(tr => tr.addEventListener('click', () => { const d = $(`#tc-${tr.dataset.i}`); d.style.display = d.style.display === 'none' ? '' : 'none'; }));
}

// ---------------------------------------------------------------- files
function renderFiles(b) {
  const el = $('#p-files');
  el.innerHTML = `<table><thead><tr><th>file</th><th class="num">size</th><th></th></tr></thead><tbody>${b.files.map(f =>
    `<tr><td class="mono"><a href="/raw/${encodeURIComponent(b.run)}/${f.name.split('/').map(encodeURIComponent).join('/')}" target="_blank" rel="noopener">${esc(f.name)}</a>${f.core ? '' : ' <span class="muted small">(written by the harness)</span>'}</td><td class="num">${kb(f.bytes)}</td><td class="small muted">${f.core ? '' : 'raw'}</td></tr>`).join('')}</tbody></table>
    <p class="muted small">Folder: <code>runs/${esc(b.run)}/</code></p>`;
}

return { render, cancel };

})();

// One router and one shell for landing, onboarding, and recorded results.
function renderApp() {
  RunViewer.cancel();
  const route = location.hash.slice(1).replace(/^\/|\/$/g, '');
  const runsLink = document.querySelector('[data-nav=runs]');
  if (route === 'runs' || route.startsWith('runs/')) runsLink.setAttribute('aria-current', 'page');
  else runsLink.removeAttribute('aria-current');
  if (!HarnessUI.render()) RunViewer.render(route);
}
window.addEventListener('hashchange', () => { renderApp(); window.scrollTo(0, 0); HarnessUI.focusHeading(); });
// Served by serve.py this answers and real GitHub sign-in takes over; on the static site it 404s and the preview stands.
fetch('/api/me', { headers: { Accept: 'application/json' } })
  .then(r => r.ok ? r.json() : null)
  .then(me => { if (me && me.auth) { HarnessUI.setSession(me); renderApp(); } })
  .catch(() => {});
// Preserve existing direct links to a run or the run list.
if (!['/', '/index.html'].includes(location.pathname)) {
  const path = location.pathname.replace(/^\/|\/$/g, '');
  const route = path === 'runs' || path.startsWith('runs/') ? path : 'runs/' + path;
  const oldTab = location.hash.slice(1);
  const tab = ['traj', 'calls', 'verifier', 'logs', 'recipe', 'run', 'files'].includes(oldTab) ? '?tab=' + oldTab : '';
  history.replaceState({}, '', '/#' + route + tab);
}
renderApp();

</script>
</body>
